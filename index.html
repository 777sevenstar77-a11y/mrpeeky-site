<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Mr.Peeky — Coming Soon</title>

<meta name="description" content="Mr.Peeky is coming soon. A playful character exploring a new world. Follow the journey and be part of what’s next.">

<meta property="og:title" content="Mr.Peeky — Coming Soon">
<meta property="og:description" content="Something playful is coming. Meet Mr. Peeky.">
<meta property="og:url" content="https://mrpeeky.com">
<meta property="og:type" content="website">

<style>
html,body{
height:100%;
margin:0;
font-family:Arial, sans-serif;
background:#000;
overflow:hidden;
-webkit-user-select:none;
user-select:none;
-webkit-touch-callout:none;
}

.scene{
position:relative;
height:100%;
background:url("space.jpg") center/cover no-repeat;
}

/* STAR FIELD */
.scene::before,
.scene::after{
content:"";
position:absolute;
inset:-10%;
background:
radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 2px)
0 0/140px 140px;
opacity:.10;
pointer-events:none;
animation:drift 120s linear infinite;
}
.scene::after{
background-size:220px 220px;
opacity:.06;
animation:drift 180s linear infinite, twinkle 6s ease-in-out infinite;
}

@keyframes drift{
from{transform:translate(0,0);}
to{transform:translate(-140px,90px);}
}
@keyframes twinkle{
0%,100%{opacity:.05;}
50%{opacity:.16;}
}

.wrap{
position:relative;
width:100%;
height:100%;
}

/* LAYERS */
.earth,.horizonGlow{z-index:10;}
.watermarkOverlay{z-index:15;}
.brand{z-index:60;}
.hello{z-index:70;}
.coming{z-index:70;}
.footer{z-index:80;}
.fadeBottom{z-index:90;}

/* WATERMARK */
.watermarkOverlay{
position:absolute;
inset:0;
background:url("watermark.png") repeat;
background-size:220px 220px;
opacity:.08;
pointer-events:none;
transform:rotate(-18deg);
}

/* EARTH */
.earth{
position:absolute;
left:50%;
bottom:0;
transform:translateX(-50%);
width:1100px;
max-width:120vw;
filter:drop-shadow(0 0 40px rgba(80,190,255,.55));
}

/* HORIZON */
.horizonGlow{
position:absolute;
left:50%;
bottom:120px;
transform:translateX(-50%);
width:900px;
height:140px;
background:radial-gradient(ellipse at center,
rgba(0,180,255,.35) 0%,
rgba(0,180,255,.15) 35%,
rgba(0,0,0,0) 70%);
filter:blur(22px);
animation:horizonPulse 2s ease-in-out infinite;
}
@keyframes horizonPulse{
0%,100%{opacity:.5;}
50%{opacity:.75;}
}

/* LOGO */
.brand{
position:absolute;
left:50%;
top:35%;
transform:translate(-50%,-50%) translateY(10px);
opacity:0;
transition:.9s;
}
.brand.show{
opacity:1;
transform:translate(-50%,-50%) translateY(0);
}
.brand img{
width:240px;
display:block;
filter:drop-shadow(0 16px 40px rgba(0,0,0,.35));
}

/* HELLO */
.hello{
position:absolute;
left:50%;
bottom:80px;
transform:translateX(-50%);
font-size:78px;
letter-spacing:10px;
font-weight:bold;
white-space:nowrap;
color:white;
text-shadow:
0 0 15px rgba(0,180,255,.7),
0 0 40px rgba(0,180,255,.5);
opacity:0;
transition:.6s;
}
.hello.show{opacity:1;}

.cursor{margin-left:8px;animation:blink .9s infinite;}
@keyframes blink{50%{opacity:0;}}

/* COMING */
.coming{
position:absolute;
right:30px;
top:50%;
transform:translateY(-50%) translateX(12px);
opacity:0;
transition:.9s;
color:white;
text-align:right;
}
.coming.show{
opacity:1;
transform:translateY(-50%) translateX(0);
}
.coming h1{
margin:0;
letter-spacing:4px;
font-size:42px;
}

/* INSTAGRAM */
.igLink{
display:inline-flex;
align-items:center;
gap:8px;
margin-top:10px;
color:white;
text-decoration:none;
opacity:.85;
font-size:14px;
}
.igLink:hover{opacity:1;text-decoration:underline;}
.igIcon{
width:26px;height:26px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.18);
}

/* FOOTER */
.footer{
position:absolute;
bottom:18px;
left:50%;
transform:translateX(-50%);
font-size:11px;
opacity:.45;
color:white;
}

/* FADE */
.fadeBottom{
position:absolute;
bottom:0;
left:0;
width:100%;
height:140px;
background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0));
}

/* MOBILE */
@media(max-width:768px){

.horizonGlow{display:none;}

.earth{
display:block;
width:140vw;
bottom:-120px;
filter:blur(2px) drop-shadow(0 0 25px rgba(80,190,255,.45));
opacity:.75;
}

.brand{
top:38%;
}
.brand img{width:180px;}

.hello{
font-size:44px;
letter-spacing:3px;
bottom:58px;
}

.coming{
right:20px;
top:10%;
transform:none;
}
.coming h1{
font-size:30px;
}
}
</style>
</head>

<body>

<div class="scene">
<div class="wrap">

<div class="watermarkOverlay"></div>

<img src="earth.png" class="earth" draggable="false" alt="">
<div class="horizonGlow"></div>

<div class="brand" id="brand">
  <img src="logo.png" draggable="false" alt="">
</div>

<div class="hello" id="hello">
<span id="typed"></span><span class="cursor">|</span>
</div>

<div class="coming" id="coming">
<h1>COMING SOON</h1>

<a class="igLink" href="https://instagram.com/mrpeeky.art" target="_blank">
<span class="igIcon">📷</span>
Instagram: @mrpeeky.art
</a>
</div>

<div class="footer">© <span id="year"></span> Mr.Peeky</div>
<div class="fadeBottom"></div>

</div>
</div>

<script>
document.getElementById("year").textContent=new Date().getFullYear();

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());

const brand=document.getElementById("brand");
const hello=document.getElementById("hello");
const coming=document.getElementById("coming");

setTimeout(()=>brand.classList.add("show"),400);

setTimeout(()=>{
hello.classList.add("show");
typeText("HELLO WORLD",110);
},2500);

setTimeout(()=>coming.classList.add("show"),6000);

function typeText(text,speed){
const el=document.getElementById("typed");
let i=0;
(function t(){
if(i<=text.length){
el.textContent=text.slice(0,i++);
setTimeout(t,speed);
}
})();
}
</script>

</body>
</html>
